{% extends "base.html" %}
{% block title %}板块列表 - 技术社区{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="content-card">
            <h4 class="mb-3"><i class="bi bi-collection text-primary"></i> 全部板块</h4>
            <div class="list-group boards-mobile">
                {% for b in boards %}
                <a href="{{ url_for('index', board=b.board_id) }}"
                   class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                    <span class="board-ico {{ b.board_name|board_color }}">{{ b.board_name[0] }}</span>
                    <span class="fw-semibold">{{ b.board_name }}</span>
                    <span class="ms-auto text-muted small">{{ post_counts.get(b.board_id, 0) }} 帖</span>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
