{% extends "base.html" %}
{% block title %}登录 - 技术社区{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="content-card">
        <h4 class="text-center mb-4"><i class="bi bi-chat-dots text-primary"></i> 登录技术社区</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2">登录</button>
        </form>
        <p class="text-center mt-3 mb-0 text-muted">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
        <p class="text-center mt-2 mb-0 small text-muted">账号被封禁？<a href="{{ url_for('appeal') }}">账号申诉</a></p>
    </div>
</div>
{% endblock %}
