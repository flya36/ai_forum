{% extends "base.html" %}
{% block title %}AI 智能问答{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{{ url_for('index') }}" class="back-link mb-2 d-inline-block"><i class="bi bi-arrow-left"></i> 返回首页</a>
        <div class="content-card">
            <h5 class="mb-3"><i class="bi bi-robot text-primary"></i> AI 智能问答</h5>
            <p class="text-muted small">基于社区帖子内容，为你智能解答问题</p>
            <form method="POST" class="mb-4">
                <div class="input-group">
                    <input type="text" name="question" class="form-control" placeholder="输入你的问题，如：如何连接数据库？" required>
                    <button type="submit" class="btn btn-primary-custom">提问</button>
                </div>
            </form>
            {% if answer %}
            <div class="border rounded p-3 bg-light">
                <div class="fw-bold mb-2"><i class="bi bi-robot"></i> AI 助手</div>
                <div style="white-space: pre-wrap; line-height:1.8;">{{ answer.answer }}</div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
